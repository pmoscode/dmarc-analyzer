# Local test setup: TLS termination (Caddy, self-signed certificate)
# + mock OIDC provider instead of a real Authentik — for locally trying
# out the login flow ONLY, never intended for production.
#
# `docker compose up` automatically loads this file in addition to
# docker-compose.yml (Compose convention "docker-compose.override.yml").
# To test "for real" instead (without this override):
#   docker compose -f docker-compose.yml up
#
# Prerequisite: .env with the values from .env.local.example (not from
# .env.example — different OIDC parameters; IMAP values may stay as
# placeholders, no real mailbox is needed for the login test).
#
# Steps:
#   1. cp .env.local.example .env
#   2. task compose:build   (or: docker compose build dmarc-analyzer —
#      then without version/commit shown in the UI)
#   3. ./caddy/local-ca/generate.sh   (one-time — local test CA/certificate)
#   4. task compose:up      (or: docker compose up)
#   5. Browser: open https://dmarc.localtest.me, confirm the certificate
#      warning (self-signed), also confirm the login redirect to
#      https://idp.localtest.me.
#   6. Log in at the mock IdP with admin/admin (see mock-idp/users.json).
#
# "*.localtest.me" is a public DNS zone that resolves to 127.0.0.1 — no
# /etc/hosts entry needed. Inside the Docker network, dmarc-analyzer and
# mock-idp resolve the same names via Caddy's network alias (see below),
# so server and browser requests consistently end up at the same
# hostname.
services:
  dmarc-analyzer:
    # !reset instead of just "[]": Compose appends lists between files
    # by default instead of replacing them — without !reset, "8080:8080"
    # from docker-compose.yml would remain published in addition.
    ports: !reset []
    networks:
      - edge
    volumes:
      # So the Go binary's OIDC discovery/token calls trust the local
      # test CA (see caddy/local-ca/generate.sh) — replaces exactly the
      # file Go/Debian read by default as the system trust anchor.
      - ./caddy/local-ca/combined-ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/local-ca/server.crt:/certs/server.crt:ro
      - ./caddy/local-ca/server.key:/certs/server.key:ro
      - caddy-data:/data
    depends_on:
      - dmarc-analyzer
      - mock-idp
    networks:
      edge:
        aliases:
          - dmarc.localtest.me
          - idp.localtest.me

  mock-idp:
    image: ghcr.io/soluto/oidc-server-mock:latest
    # The arm64 image of this tag crashes on startup
    # (System.IO.FileLoadException on OpenIdConnectServerMock.dll,
    # reproducible even without our mounts) — run it as amd64 via
    # Rosetta emulation on Apple Silicon hosts, that works.
    platform: linux/amd64
    environment:
      ASPNETCORE_URLS: http://+:80
      # Without this signal, the container considers itself "HTTP only"
      # (Caddy terminates TLS externally) and sets its auth cookie
      # ('idsrv', SameSite=None) without the Secure flag — Chrome
      # immediately discards such a cookie, so the session is lost right
      # after login (endless loop back to login). This flag lets the
      # container honor Caddy's X-Forwarded-Proto header.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # IssuerUri: the discovery document, the "iss" claim of the ID
      # tokens, and endpoint URLs point to the public name instead of
      # the internal container hostname — otherwise issuer validation in
      # dmarc-analyzer fails (see docs/features/auth.md, step 3 of the
      # flow).
      SERVER_OPTIONS_INLINE: '{"IssuerUri": "https://idp.localtest.me"}'
      CLIENTS_CONFIGURATION_PATH: /tmp/config/clients.json
      USERS_CONFIGURATION_PATH: /tmp/config/users.json
      # "groups" is not one of the built-in standard identity resources
      # (openid/profile/email) — without this registration, IdentityServer
      # rejects the "groups" scope that dmarc-analyzer hardcodes in its
      # request with "invalid_scope".
      IDENTITY_RESOURCES_PATH: /tmp/config/identity-resources.json
    volumes:
      - ./mock-idp/clients.json:/tmp/config/clients.json:ro
      - ./mock-idp/users.json:/tmp/config/users.json:ro
      - ./mock-idp/identity-resources.json:/tmp/config/identity-resources.json:ro
    networks:
      - edge
    # The built-in healthcheck checks https://localhost/health — but the
    # container itself deliberately speaks only HTTP here, TLS is
    # handled by Caddy. Without this line the container would stay
    # "unhealthy" forever (harmless, since nothing depends on
    # service_healthy for it, but misleading in "docker compose ps").
    healthcheck:
      disable: true

networks:
  edge:

volumes:
  caddy-data:
