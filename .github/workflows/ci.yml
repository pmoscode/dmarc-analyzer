name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # ubuntu-latest only: since the move to "Docker-native only" the
  # application runs exclusively as a Linux container, so a macOS/Windows
  # matrix (which used to check real OS keychain/path differences — see
  # this file's Git history) no longer covers anything that Linux alone
  # doesn't already cover.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: "3.53.1"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Check fmt drift
        run: |
          task fmt
          git diff --exit-code -- '*.go' || {
            echo "::error::gofmt/goimports would have changed files — run 'task fmt' locally and commit."
            exit 1
          }

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Build
        run: task build

  # docker builds and publishes the container image to GHCR — replaces
  # the former "release" job (macOS/Windows/Linux binaries as GitHub
  # release assets), which went away with the move to "Docker-native
  # only". Runs only after "check" is green, and only for two cases: a
  # version tag (concrete version + "latest") or a push to main (a
  # moving "dev" tag for the latest state).
  docker:
    name: Build and publish Docker image
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # type=semver only ever fires on a tag push that parses as semver
      # anyway (no enable needed) — "latest" and "dev", on the other
      # hand, would be created on EVERY run of this job without enable,
      # so they're explicitly restricted here to exactly the one trigger
      # they're meant for.
      - name: Determine metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
