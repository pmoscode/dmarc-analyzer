name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Nur noch ubuntu-latest: die Anwendung läuft seit dem Umstieg auf
  # "rein Docker nativ" ausschließlich als Linux-Container, eine
  # macOS/Windows-Matrix (die zuvor echte OS-Schlüsselbund-/Pfad-
  # Unterschiede prüfte, siehe Git-Historie dieser Datei) prüft dafür
  # nichts mehr, das nicht auch Linux allein abdeckt.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Task installieren
        uses: arduino/setup-task@v2
        with:
          version: "3.53.1"

      - name: golangci-lint installieren
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: fmt-Drift prüfen
        run: |
          task fmt
          git diff --exit-code -- '*.go' || {
            echo "::error::gofmt/goimports hätte Dateien verändert — bitte 'task fmt' lokal ausführen und committen."
            exit 1
          }

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Build
        run: task build

  # docker baut und veröffentlicht das Container-Image nach GHCR — ersetzt
  # den früheren "release"-Job (macOS/Windows/Linux-Binärdateien als
  # GitHub-Release-Anhang), der mit dem Umstieg auf "rein Docker nativ"
  # entfallen ist. Läuft nur bei einem Versions-Tag, erst nachdem "check"
  # grün war.
  docker:
    name: Docker-Image bauen und veröffentlichen
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags/Labels) ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
