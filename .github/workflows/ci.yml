name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Task installieren
        uses: arduino/setup-task@v2
        with:
          version: "3.53.1"

      - name: golangci-lint installieren
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: fmt-Drift prüfen
        shell: bash
        run: |
          task fmt
          git diff --exit-code -- '*.go' || {
            echo "::error::gofmt/goimports hätte Dateien verändert — bitte 'task fmt' lokal ausführen und committen."
            exit 1
          }

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Build
        run: task build
