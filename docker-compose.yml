# Example for local operation, or as a template for production —
# full ENV reference in docs/features/deployment.md.
#
# Prerequisite: an Authentik application (OAuth2/OIDC provider) with
# redirect URI "<public-URL>/anmelden/callback" and a group entered as
# DMARC_OIDC_ADMIN_GROUP (see docs/features/auth.md).
#
# Values come from .env (template: copy .env.example, fill it in — .env
# is in .gitignore and is never committed).
services:
  dmarc-analyzer:
    # VERSION/COMMIT end up in the binary via -ldflags and as OCI labels
    # in the image (see Dockerfile). "task compose:build"/"task
    # compose:up" set both from Git; with a direct "docker compose
    # build" they stay empty or "dev" unless exported yourself.
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
    # image: ghcr.io/pmoscode/dmarc-analyzer:latest
    ports:
      - "8080:8080"
    volumes:
      - dmarc-data:/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  dmarc-data:
