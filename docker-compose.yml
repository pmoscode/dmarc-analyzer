# Beispiel für den lokalen Betrieb bzw. als Vorlage für die Produktion —
# vollständige ENV-Referenz in docs/features/deployment.md.
#
# Voraussetzung: eine Authentik-Anwendung (OAuth2/OIDC-Provider) mit
# Redirect-URI "<öffentliche-URL>/anmelden/callback" und einer Gruppe, die
# als DMARC_OIDC_ADMIN_GROUP eingetragen wird (siehe docs/features/auth.md).
#
# Werte kommen aus .env (Vorlage: .env.example kopieren, ausfüllen — .env
# ist in .gitignore und wird nie committet).
services:
  dmarc-analyzer:
    # VERSION/COMMIT landen per -ldflags im Binary und als OCI-Labels im
    # Image (siehe Dockerfile). "task compose:build"/"task compose:up"
    # setzen beide aus Git; bei einem direkten "docker compose build"
    # bleiben sie leer bzw. "dev", sofern nicht selbst exportiert.
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
    # image: ghcr.io/pmoscode/dmarc-analyzer:latest
    ports:
      - "8080:8080"
    volumes:
      - dmarc-data:/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  dmarc-data:
