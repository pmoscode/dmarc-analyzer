# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  MODULE: github.com/pmoscode/dmarc-analyzer
  BIN_DIR: bin
  BIN_NAME: dmarc-analyzer
  COVER_FILE: coverage.out
  # VERSION: latest tag plus distance/hash, e.g. "v0.1.0-2-g9a79aa6-dirty".
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # COMMIT: full hash, with "-dirty" for uncommitted changes — the
  # --match against a tag that never exists forces plain hash output.
  COMMIT:
    sh: git describe --always --dirty --abbrev=40 --match='NeVeRmAtCh' 2>/dev/null || true
  IMAGE: '{{.BIN_NAME}}'
  CONTAINER: '{{.BIN_NAME}}'

# VERSION/COMMIT also as environment variables — docker-compose.yml
# passes them through as build args to the Dockerfile (see compose:* tasks).
env:
  VERSION: '{{.VERSION}}'
  COMMIT: '{{.COMMIT}}'

tasks:
  default:
    desc: Shows the available tasks.
    cmds:
      - task --list

  setup:
    desc: Install tools and download dependencies.
    cmds:
      - go mod download
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

  build:
    desc: Build the binary into bin/, with version and Git commit embedded.
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" -o {{.BIN_DIR}}/{{.BIN_NAME}} ./cmd/dmarc-analyzer
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/{{.BIN_NAME}}"

  run:
    desc: Start the program in development mode (with no arguments, opens the default browser to the web UI).
    cmds:
      - go run ./cmd/dmarc-analyzer {{.CLI_ARGS}}

  test:
    desc: All tests, with -race.
    cmds:
      - go test ./... -race -count=1

  test:unit:
    desc: Fast tests only (without the integration build tag).
    cmds:
      - go test ./... -race -count=1 -short

  test:integration:
    desc: Integration tests (integration build tag).
    cmds:
      - go test ./... -race -count=1 -tags=integration

  cover:
    desc: Measure coverage and open it as HTML.
    cmds:
      - go test ./... -race -count=1 -coverprofile={{.COVER_FILE}}
      - go tool cover -html={{.COVER_FILE}} -o coverage.html
      - go tool cover -func={{.COVER_FILE}}

  lint:
    desc: golangci-lint run.
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: gofmt -s -w and goimports.
    cmds:
      - gofmt -s -w .
      - go run golang.org/x/tools/cmd/goimports@latest -w -local {{.MODULE}} .

  tidy:
    desc: go mod tidy and check for unused dependencies.
    cmds:
      - go mod tidy
      - go run golang.org/x/tools/cmd/deadcode@latest ./cmd/dmarc-analyzer || true

  docker:build:
    desc: Build the Docker image locally, with version and Git commit (tagged as VERSION and latest).
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        -t {{.IMAGE}}:{{.VERSION}}
        -t {{.IMAGE}}:latest
        .

  docker:run:
    desc: >-
      Start the locally built image in the foreground (builds first if needed) —
      expects a .env file with the variables documented in
      .env.example/docs/features/deployment.md.
    deps: [docker:build]
    cmds:
      - >-
        docker run --rm --name {{.CONTAINER}}
        -p 8080:8080
        --env-file .env
        -v dmarc-data:/data
        {{.IMAGE}}:{{.VERSION}} {{.CLI_ARGS}}

  docker:version:
    desc: Show version and Git commit of the locally built image (from the OCI labels).
    cmds:
      - >-
        docker image inspect {{.IMAGE}}:latest
        --format 'Version: {{"{{"}}index .Config.Labels "org.opencontainers.image.version"{{"}}"}}{{"{{"}}println{{"}}"}}Commit:  {{"{{"}}index .Config.Labels "org.opencontainers.image.revision"{{"}}"}}'

  compose:build:
    desc: Build images via docker compose, with version and Git commit.
    cmds:
      - docker compose build {{.CLI_ARGS}}

  compose:up:
    desc: Start docker compose in the background (rebuilds first with version and Git commit).
    cmds:
      - docker compose up -d --build {{.CLI_ARGS}}

  compose:down:
    desc: Stop docker compose and remove containers (volumes are kept).
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:logs:
    desc: Follow dmarc-analyzer logs via docker compose.
    cmds:
      - docker compose logs -f dmarc-analyzer

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -rf {{.BIN_DIR}} {{.COVER_FILE}} coverage.html

  check:
    desc: fmt + lint + test — the same thing CI runs.
    cmds:
      - task: fmt
      - task: lint
      - task: test

  upgrade:
    desc: "Updates all dependencies to the latest versions"
    cmds:
      - go get -u ./...
      - go get -u go@latest
      - go mod tidy
