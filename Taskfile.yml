# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  MODULE: github.com/pmoscode/dmarc-analyzer
  BIN_DIR: bin
  BIN_NAME: dmarc-analyzer
  COVER_FILE: coverage.out
  # VERSION: letzter Tag plus Abstand/Hash, z. B. "v0.1.0-2-g9a79aa6-dirty".
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # COMMIT: voller Hash, bei uncommitteten Änderungen mit "-dirty" — das
  # --match auf ein nie existierendes Tag erzwingt die reine Hash-Ausgabe.
  COMMIT:
    sh: git describe --always --dirty --abbrev=40 --match='NeVeRmAtCh' 2>/dev/null || true
  IMAGE: '{{.BIN_NAME}}'
  CONTAINER: '{{.BIN_NAME}}'

# VERSION/COMMIT auch als Umgebungsvariablen — docker-compose.yml reicht
# sie als Build-Args an das Dockerfile durch (siehe compose:*-Tasks).
env:
  VERSION: '{{.VERSION}}'
  COMMIT: '{{.COMMIT}}'

tasks:
  default:
    desc: Zeigt die verfügbaren Tasks.
    cmds:
      - task --list

  setup:
    desc: Werkzeuge installieren und Abhängigkeiten laden.
    cmds:
      - go mod download
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

  build:
    desc: Binärdatei nach bin/ bauen, Version und Git-Commit eingebettet.
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" -o {{.BIN_DIR}}/{{.BIN_NAME}} ./cmd/dmarc-analyzer
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/{{.BIN_NAME}}"

  run:
    desc: Programm im Entwicklungsmodus starten (ohne Argumente öffnet sich der Standardbrowser mit der Web-Oberfläche).
    cmds:
      - go run ./cmd/dmarc-analyzer {{.CLI_ARGS}}

  test:
    desc: Alle Tests mit -race.
    cmds:
      - go test ./... -race -count=1

  test:unit:
    desc: Nur schnelle Tests (ohne Build-Tag integration).
    cmds:
      - go test ./... -race -count=1 -short

  test:integration:
    desc: Integrationstests (Build-Tag integration).
    cmds:
      - go test ./... -race -count=1 -tags=integration

  cover:
    desc: Coverage messen und als HTML öffnen.
    cmds:
      - go test ./... -race -count=1 -coverprofile={{.COVER_FILE}}
      - go tool cover -html={{.COVER_FILE}} -o coverage.html
      - go tool cover -func={{.COVER_FILE}}

  lint:
    desc: golangci-lint run.
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: gofmt -s -w und goimports.
    cmds:
      - gofmt -s -w .
      - go run golang.org/x/tools/cmd/goimports@latest -w -local {{.MODULE}} .

  tidy:
    desc: go mod tidy und Prüfung auf ungenutzte Abhängigkeiten.
    cmds:
      - go mod tidy
      - go run golang.org/x/tools/cmd/deadcode@latest ./cmd/dmarc-analyzer || true

  docker:build:
    desc: Docker-Image lokal bauen, mit Version und Git-Commit (getaggt als VERSION und latest).
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        -t {{.IMAGE}}:{{.VERSION}}
        -t {{.IMAGE}}:latest
        .

  docker:run:
    desc: >-
      Lokal gebautes Image im Vordergrund starten (baut vorher, falls nötig) —
      erwartet eine .env-Datei mit den in .env.example/docs/features/deployment.md
      dokumentierten Variablen.
    deps: [docker:build]
    cmds:
      - >-
        docker run --rm --name {{.CONTAINER}}
        -p 8080:8080
        --env-file .env
        -v dmarc-data:/data
        {{.IMAGE}}:{{.VERSION}} {{.CLI_ARGS}}

  docker:version:
    desc: Version und Git-Commit des lokal gebauten Images anzeigen (aus den OCI-Labels).
    cmds:
      - >-
        docker image inspect {{.IMAGE}}:latest
        --format 'Version: {{"{{"}}index .Config.Labels "org.opencontainers.image.version"{{"}}"}}{{"{{"}}println{{"}}"}}Commit:  {{"{{"}}index .Config.Labels "org.opencontainers.image.revision"{{"}}"}}'

  compose:build:
    desc: Images per docker compose bauen, mit Version und Git-Commit.
    cmds:
      - docker compose build {{.CLI_ARGS}}

  compose:up:
    desc: docker compose im Hintergrund starten (baut vorher mit Version und Git-Commit neu).
    cmds:
      - docker compose up -d --build {{.CLI_ARGS}}

  compose:down:
    desc: docker compose stoppen und Container entfernen (Volumes bleiben erhalten).
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:logs:
    desc: Logs von dmarc-analyzer per docker compose verfolgen.
    cmds:
      - docker compose logs -f dmarc-analyzer

  clean:
    desc: Build-Artefakte entfernen.
    cmds:
      - rm -rf {{.BIN_DIR}} {{.COVER_FILE}} coverage.html

  check:
    desc: fmt + lint + test — das, was auch die CI ausführt.
    cmds:
      - task: fmt
      - task: lint
      - task: test

  upgrade:
    desc: "Updates all dependencies to the latest versions"
    cmds:
      - go get -u ./...
      - go get -u go@latest
      - go mod tidy
