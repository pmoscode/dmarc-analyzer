<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — DMARC Analyzer</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="app-header">
    <h1>DMARC Analyzer</h1>
    <nav class="app-nav" aria-label="Hauptnavigation">
      <ul>
        {{range .Nav}}<li><a href="{{.Href}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Label}}</a></li>{{end}}
      </ul>
    </nav>
  </header>
  <main class="app-main">
    {{template "content" .}}
  </main>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/vendor/chartjs-chart-matrix.min.js"></script>
  <script src="/static/vendor/chartjs-plugin-zoom.min.js"></script>
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/charts.js"></script>
</body>
</html>
