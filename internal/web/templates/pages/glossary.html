{{define "content"}}
<section class="glossary" aria-label="Glossar">
  <p class="chart-hint">Begriffe rund um DMARC, alphabetisch in der Reihenfolge ihres ersten Auftretens in der Übersicht.</p>
  <dl>
    {{range .Terms}}
    <div class="glossary-entry" id="{{.Slug}}">
      <dt>{{.Name}}</dt>
      <dd>{{.Definition}}</dd>
    </div>
    {{end}}
  </dl>
</section>
{{end}}
