{{define "content"}}
<section class="detail-card narrow-card">
  <h2>Schlüsselspeicher entsperren</h2>
  <p class="chart-hint">
    Kein Betriebssystem-Schlüsselbund verfügbar — Zugangsdaten liegen
    stattdessen verschlüsselt in einer lokalen Datei. Bitte die
    Master-Passphrase eingeben.
  </p>
  {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
  <form method="post" action="/entsperren" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{csrfToken}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Master-Passphrase
      <input type="password" name="passphrase" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit">Entsperren</button>
  </form>
</section>
{{end}}
