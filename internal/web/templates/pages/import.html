{{define "content"}}
{{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
{{if .HasResult}}
<p class="form-success">{{.New}} neu, {{.Skipped}} übersprungen, {{.Failed}} fehlerhaft.</p>
{{end}}

<section class="detail-card narrow-card">
  <h2>DMARC-Reports importieren</h2>
  <p class="chart-hint">Unterstützte Formate: .eml, .xml, .xml.gz, .zip — auch mehrere Dateien auf einmal.</p>
  <form method="post" action="/import" enctype="multipart/form-data" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{csrfToken}}">
    <label class="dropzone" id="import-dropzone" for="import-file-input">
      <input type="file" name="dateien" id="import-file-input" multiple accept=".eml,.xml,.gz,.zip" class="dropzone-input">
      <span id="import-dropzone-text">Dateien hierher ziehen oder klicken zum Auswählen</span>
    </label>
    <button type="submit">Hochladen</button>
  </form>
</section>
{{end}}
