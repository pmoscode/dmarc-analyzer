version: "2"

linters:
  default: none
  # misspell is deliberately not enabled — see AGENTS.md's language rule
  # for why it was originally disabled and why re-enabling it is a
  # deliberate follow-up rather than a side effect of any given change.
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - gocritic
    - bodyclose
    - noctx
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - nolintlint
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: error-strings
        - name: error-naming
    gosec:
      excludes:
        # G304 (file path from variable): config/import paths are
        # application-controlled, not raw from network input.
        - G304
  exclusions:
    rules:
      # Test code may have more obvious error handling; require/assert
      # take care of reporting.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # G201/G202 (SQL string building): internal/infra/sqlite assembles
      # WHERE, ORDER BY, and IN clauses from a fixed, internal set of
      # column names and generated "?" placeholders — never from raw
      # external values. The actual values always go through bound
      # parameters (see buildWhere/buildOrderBy/buildCursorWhere and the
      # batch IN loader functions).
      - path: internal/infra/sqlite/.*\.go
        linters:
          - gosec
        text: "G20[12]"
      # G101 (hardcoded credentials): internal/ui/i18n contains only UI
      # label text, no real secrets — "password" in a label string here
      # is always just a word, never a hardcoded credential.
      - path: internal/ui/i18n/.*\.go
        linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pmoscode/dmarc-analyzer

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
